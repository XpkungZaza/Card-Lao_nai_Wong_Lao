 <style>
        /* ========================================
   Deep Heart Card Game — INDEX PAGE
   Theme: Muted Gold · Black · White
   ======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #0a0a0a;
    font-family: 'Kanit', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* === พื้นหลัง glow ทองเบาๆ === */
.bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.bg-layer::before {
    content: '';
    position: absolute;
    top: -25%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 60%;
    background: radial-gradient(
        ellipse at center,
        rgba(169, 130, 46, 0.12) 0%,
        rgba(140, 107, 35, 0.05) 40%,
        transparent 70%
    );
}

.bg-layer::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35%;
    background: linear-gradient(to top, rgba(10, 10, 10, 0.95), transparent);
}

/* เส้นตารางบางๆ */
.grid-pattern {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(169, 130, 46, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(169, 130, 46, 0.025) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* จุดทองกระพริบ */
.dot-pulse {
    position: fixed;
    border-radius: 50%;
    background: #b8960c;
    pointer-events: none;
    z-index: 0;
}

.dot-pulse:nth-child(1) {
    top: 12%;
    right: 15%;
    width: 3px;
    height: 3px;
    box-shadow: 0 0 6px 2px rgba(184, 150, 12, 0.35);
    animation: pulse 4s ease-in-out infinite;
}

.dot-pulse:nth-child(2) {
    bottom: 20%;
    left: 10%;
    width: 2px;
    height: 2px;
    box-shadow: 0 0 4px 1px rgba(184, 150, 12, 0.25);
    animation: pulse 5s ease-in-out 1s infinite;
}

.dot-pulse:nth-child(3) {
    top: 60%;
    right: 8%;
    width: 2px;
    height: 2px;
    box-shadow: 0 0 4px 1px rgba(184, 150, 12, 0.2);
    animation: pulse 3.5s ease-in-out 0.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.8); }
}

/* === Container หลัก === */
.index-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
    padding: 30px;
    width: 100%;
    max-width: 600px;
}

/* === Brand === */
.brand {
    text-align: center;
    animation: fadeInDown 0.8s ease-out both;
}

.brand-icon {
    font-size: 2.2rem;
    color: #c9a84c;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 10px rgba(201, 168, 76, 0.3));
}

.brand h1 {
    font-size: 2rem;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 1.2;
}

.brand h1 span {
    color: #c9a84c;
}

.brand-sub {
    font-size: 0.8rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
}

/* === หัวข้อ Choose Your Game === */
.section-title {
    text-align: center;
    animation: fadeInDown 0.8s ease-out 0.15s both;
}

.section-title h2 {
    font-size: 1.3rem;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 1px;
}

.section-title .line {
    width: 40px;
    height: 2px;
    background: #c9a84c;
    margin: 12px auto 0;
    border-radius: 2px;
    opacity: 0.6;
}

/* === Game Cards === */
.game-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 380px;
}

.game-card {
    position: relative;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid rgba(201, 168, 76, 0.15);
    border-radius: 16px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

/* เส้นทองด้านซ้าย */
.game-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: #c9a84c;
    border-radius: 0 3px 3px 0;
    transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Hover glow จากซ้าย */
.game-card::after {
    content: '';
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, rgba(201, 168, 76, 0.06), transparent);
    transition: left 0.5s ease;
}

.game-card:hover {
    border-color: rgba(201, 168, 76, 0.4);
    background: rgba(255, 255, 255, 0.05);
    transform: translateX(4px);
}

.game-card:hover::before {
    height: 60%;
}

.game-card:hover::after {
    left: 0;
}

.game-card:active {
    transform: translateX(4px) scale(0.98);
}

/* Stagger animation */
.game-card:nth-child(1) { animation: fadeInUp 0.6s ease-out 0.3s both; }
.game-card:nth-child(2) { animation: fadeInUp 0.6s ease-out 0.45s both; }
.game-card:nth-child(3) { animation: fadeInUp 0.6s ease-out 0.6s both; }

/* Icon box */
.game-card .icon-box {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(201, 168, 76, 0.08);
    border: 1px solid rgba(201, 168, 76, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #c9a84c;
    transition: all 0.35s ease;
    position: relative;
    z-index: 1;
}

.game-card:hover .icon-box {
    background: #c9a84c;
    border-color: #c9a84c;
    color: #0a0a0a;
    box-shadow: 0 0 20px rgba(201, 168, 76, 0.25);
}

/* ข้อความ */
.game-card .info {
    flex: 1;
    position: relative;
    z-index: 1;
}

.game-card .info h3 {
    font-size: 1.05rem;
    font-weight: 600;
    color: #e8e8e8;
    margin-bottom: 3px;
    transition: color 0.3s ease;
}

.game-card:hover .info h3 {
    color: #ffffff;
}

.game-card .info p {
    font-size: 0.75rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.25);
    line-height: 1.4;
}

/* ลูกศร */
.game-card .arrow {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.1);
    transition: all 0.35s ease;
    position: relative;
    z-index: 1;
}

.game-card:hover .arrow {
    color: #c9a84c;
    transform: translateX(4px);
}

/* === Footer === */
.footer-note {
    font-size: 0.65rem;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.12);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeIn 1s ease-out 1s both;
}

/* === Animations === */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* === Responsive === */
@media (max-width: 480px) {
    .index-container {
        gap: 40px;
        padding: 20px;
    }

    .brand h1 {
        font-size: 1.6rem;
    }

    .game-cards {
        max-width: 100%;
    }

    .game-card {
        padding: 18px 22px;
        gap: 14px;
    }

    .game-card .icon-box {
        width: 38px;
        height: 38px;
        font-size: 0.95rem;
    }

    .game-card .info h3 {
        font-size: 0.95rem;
    }
}
    </style>
</html>
