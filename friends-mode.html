<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends-Game👥 | XpkungZaza</title>
   
</head>
<body>
    <button onclick="window.location.href='index.html'">กลับหน้าหลัก</button>
    <div class="card-display">
        <h1 id="question-text">กดปุ่มด้านล่างเพื่อสุ่มคำถาม</h1>
    </div>
    <div class="controls">
        <button onclick="drawCard()">จั่ว</button>
    </div>
</body>
<script type="module" src="script.js"></script>

<script type="module">
    window.setMode("friends-game"); 
</script>


<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Kanit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    /* พื้นฟ้าอ่อนไล่เข้าน้ำเงิน */
    background: linear-gradient(
        160deg,
        #b2ebf2 0%,
        #4dd0e1 30%,
        #00bcd4 60%,
        #0097a7 100%
    );
}

/* === ลายวงกลมเล็กๆ เบื้องหลัง === */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(0, 188, 212, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(0, 151, 167, 0.12) 0%, transparent 25%),
        radial-gradient(circle at 60% 70%, rgba(0, 172, 193, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 10% 30%, rgba(128, 222, 234, 0.2) 0%, transparent 20%);
}

/* จุดสว่างกระพริบ */
body::after {
    content: '';
    position: fixed;
    top: 8%;
    right: 12%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    filter: blur(30px);
    animation: float-blob 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes float-blob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(15px, -20px) scale(1.1); }
    66% { transform: translate(-10px, 10px) scale(0.9); }
}

/* blob เพิ่มเติม */
.extra-blob {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(25px);
}

.extra-blob:nth-child(1) {
    bottom: 10%;
    left: 8%;
    width: 100px;
    height: 100px;
    background: rgba(178, 235, 242, 0.4);
    animation: float-blob 8s ease-in-out 2s infinite;
}

.extra-blob:nth-child(2) {
    top: 50%;
    right: 5%;
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.25);
    animation: float-blob 5s ease-in-out 1s infinite;
}

/* === ดาวลอย — เปลี่ยนจากหัวใจเป็นดาวเพื่อน === */
.floating-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.floating-hearts span {
    position: absolute;
    bottom: -30px;
    font-size: 16px;
    color: rgba(0, 151, 167, 0.18);
    animation: float-heart linear infinite;
}

.floating-hearts span:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; font-size: 14px; }
.floating-hearts span:nth-child(2) { left: 25%; animation-duration: 15s; animation-delay: 2s; font-size: 18px; }
.floating-hearts span:nth-child(3) { left: 45%; animation-duration: 10s; animation-delay: 4s; font-size: 12px; }
.floating-hearts span:nth-child(4) { left: 65%; animation-duration: 14s; animation-delay: 1s; font-size: 20px; }
.floating-hearts span:nth-child(5) { left: 80%; animation-duration: 11s; animation-delay: 3s; font-size: 15px; }
.floating-hearts span:nth-child(6) { left: 90%; animation-duration: 13s; animation-delay: 5s; font-size: 13px; }

@keyframes float-heart {
    0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    90% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg) scale(0.5);
        opacity: 0;
    }
}

/* === Container หลัก === */
.game-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 30px;
}

/* === Header === */
.mode-header {
    text-align: center;
    animation: fadeInDown 0.7s ease-out both;
}

.mode-header .icon {
    font-size: 2rem;
    color: #006064;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0, 188, 212, 0.4));
}

.mode-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #004d40;
    letter-spacing: 1px;
}

.mode-header .sub {
    font-size: 0.75rem;
    font-weight: 300;
    color: rgba(0, 77, 64, 0.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
}

/* === การ์ด — ฟ้าเข้ม ข้างในขาวตรงกลาง === */
.card-display {
    position: relative;
    background: linear-gradient(
        145deg,
        #00838f 0%,
        #0097a7 40%,
        #006064 100%
    );
    border-radius: 24px;
    padding: 18px;
    width: 85%;
    max-width: 380px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 15px 40px rgba(0, 96, 100, 0.35),
        0 5px 15px rgba(0, 96, 100, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeInUp 0.7s ease-out 0.2s both;
}

/* ขอบในเล็กๆ แบบ soft */
.card-display::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    pointer-events: none;
}

/* === พื้นที่ขาวตรงกลาง === */
.card-inner {
    background: #ffffff;
    border-radius: 16px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 35px 30px;
    position: relative;
    box-shadow: 0 2px 10px rgba(0, 96, 100, 0.1);
}

/* สัญลักษณ์ดาวเล็กด้านบน */
.card-inner::before {
    content: '✦';
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #80deea;
}

/* ตัวหนังสือคำถาม */
#question-text {
    font-size: 1.35rem;
    line-height: 1.8;
    font-weight: 500;
    color: #37474f;
}

/* Label */
.question-label {
    font-size: 0.65rem;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #4dd0e1;
    margin-bottom: 18px;
}

/* Hover การ์ด */
.card-display:hover {
    box-shadow:
        0 20px 50px rgba(0, 96, 100, 0.4),
        0 8px 20px rgba(0, 96, 100, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transform: translateY(-3px);
}

/* === ปุ่มจั่ว === */
.controls {
    animation: fadeInUp 0.7s ease-out 0.4s both;
}

.controls button {
    background: linear-gradient(135deg, #00bcd4, #00838f);
    color: #ffffff;
    border: none;
    padding: 14px 45px;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: 'Kanit', sans-serif;
    border-radius: 50px;
    cursor: pointer;
    box-shadow:
        0 8px 25px rgba(0, 131, 143, 0.35),
        0 2px 8px rgba(0, 131, 143, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

/* shine effect */
.controls button::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.18),
        transparent
    );
    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.controls button:hover::after {
    left: 120%;
}

.controls button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow:
        0 12px 35px rgba(0, 131, 143, 0.45),
        0 4px 12px rgba(0, 131, 143, 0.3);
}

.controls button:active {
    transform: translateY(0) scale(0.97);
}

/* === ปุ่มกลับ === */
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 131, 143, 0.15);
    color: #00838f;
    padding: 8px 18px;
    font-size: 0.8rem;
    font-weight: 500;
    font-family: 'Kanit', sans-serif;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.75);
    transform: translateX(-3px);
}

/* === กล่องแนะนำ (Modal) === */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 188, 212, 0.3);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s ease-out;
}

.modal-box {
    background: #ffffff;
    border-radius: 20px;
    padding: 35px 30px;
    max-width: 320px;
    width: 85%;
    text-align: center;
    box-shadow:
        0 20px 50px rgba(0, 96, 100, 0.2),
        0 0 0 4px rgba(128, 222, 234, 0.3);
    animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-box h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #00838f;
    margin-bottom: 12px;
}

.modal-box p {
    font-size: 0.85rem;
    color: #777;
    line-height: 1.6;
    margin-bottom: 20px;
}

.modal-btn {
    background: linear-gradient(135deg, #00bcd4, #00838f);
    color: #fff;
    border: none;
    padding: 10px 30px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: 'Kanit', sans-serif;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.modal-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 131, 143, 0.3);
}

/* === Animation === */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

/* จั่วการ์ดใหม่ */
@keyframes card-pop {
    0% { transform: scale(0.95); opacity: 0.5; }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); opacity: 1; }
}

.card-display.pop-in {
    animation: card-pop 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* === Responsive === */
@media (max-width: 480px) {
    .card-display {
        width: 90%;
        height: 380px;
        padding: 14px;
        border-radius: 20px;
    }

    .card-inner {
        padding: 30px 22px;
        border-radius: 14px;
    }

    #question-text {
        font-size: 1.15rem;
    }

    .mode-header h1 {
        font-size: 1.3rem;
    }

    .controls button {
        padding: 12px 35px;
        font-size: 0.95rem;
    }
}
</style>
</html>
